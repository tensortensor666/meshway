name: Build Meshway

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Build admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-admin-build
          path: frontend/dist
          retention-days: 1

  linux:
    name: Build Linux binary
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: meshway-admin-build
          path: frontend/dist
      - run: cargo build --release
      - run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          PACKAGE="package/meshway_${VERSION}_amd64"
          install -d "$PACKAGE/DEBIAN" "$PACKAGE/usr/bin" "$PACKAGE/usr/share/meshway/frontend" "$PACKAGE/etc/meshway" "$PACKAGE/lib/systemd/system"
          install -m 755 target/release/meshway "$PACKAGE/usr/bin/meshway"
          cp -r ../frontend/dist "$PACKAGE/usr/share/meshway/frontend/dist"
          sed "s/@VERSION@/$VERSION/" ../packaging/linux/control > "$PACKAGE/DEBIAN/control"
          install -m 755 ../packaging/linux/postinst "$PACKAGE/DEBIAN/postinst"
          install -m 755 ../packaging/linux/prerm "$PACKAGE/DEBIAN/prerm"
          install -m 755 ../packaging/linux/postrm "$PACKAGE/DEBIAN/postrm"
          install -m 644 ../packaging/linux/meshway.env "$PACKAGE/etc/meshway/meshway.env"
          install -m 644 ../packaging/linux/meshway.service "$PACKAGE/lib/systemd/system/meshway.service"
          dpkg-deb --build --root-owner-group "$PACKAGE" "meshway_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-linux-deb
          path: backend/meshway_*_amd64.deb

  windows:
    name: Build Windows binary
    needs: frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: meshway-admin-build
          path: frontend/dist
      - run: cargo build --release
      - run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "${env:GITHUB_WORKSPACE}\packaging\windows\meshway.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-windows-installer
          path: installer-output/Meshway-Setup.exe
