name: Build Meshway

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Build admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-admin
          path: frontend/dist

  linux:
    name: Build Linux binary
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: meshway-admin
          path: frontend/dist
      - run: cargo build --release
      - run: |
          mkdir -p release/meshway-linux-x64/frontend
          cp target/release/meshway release/meshway-linux-x64/meshway
          cp -r ../frontend/dist release/meshway-linux-x64/frontend/dist
          tar -czf meshway-linux-x64.tar.gz -C release meshway-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-linux-x64
          path: backend/meshway-linux-x64.tar.gz

  windows:
    name: Build Windows binary
    needs: frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: meshway-admin
          path: frontend/dist
      - run: cargo build --release
      - run: |
          New-Item -ItemType Directory -Force release\meshway-windows-x64\frontend | Out-Null
          Copy-Item target\release\meshway.exe release\meshway-windows-x64\meshway.exe
          Copy-Item ..\frontend\dist release\meshway-windows-x64\frontend\dist -Recurse
          Compress-Archive -Path release\meshway-windows-x64 -DestinationPath meshway-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: meshway-windows-x64
          path: backend/meshway-windows-x64.zip
